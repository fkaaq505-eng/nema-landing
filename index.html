<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Nema — Turn Property Photos Into $1,000 Virtual Tours</title>
    <meta name="description" content="Nema uses AI to transform standard real estate listing photos into immersive 3D virtual walkthroughs in under 10 minutes. Sell to agents for $750–$1,200 per property. No equipment needed." />
    <meta name="keywords" content="real estate virtual tour, AI property tour, 3D home tour, real estate AI, virtual walkthrough generator, sell virtual tours, real estate side hustle" />
    <link rel="canonical" href="https://nemamarketing.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nemamarketing.com/" />
    <meta property="og:title" content="Nema — Turn Property Photos Into $1,000 Virtual Tours" />
    <meta property="og:description" content="AI transforms any listing photos into immersive 3D walkthroughs in under 10 minutes. Sell to agents. Keep the profit." />
    <meta property="og:image" content="https://nemamarketing.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Nema" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@nemamarketing" />
    <meta name="twitter:title" content="Nema — Turn Property Photos Into $1,000 Virtual Tours" />
    <meta name="twitter:description" content="AI transforms any listing photos into immersive 3D walkthroughs in under 10 minutes. Sell to agents. Keep the profit." />
    <meta name="twitter:image" content="https://nemamarketing.com/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#04040c" />
    <meta name="color-scheme" content="dark" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Structured data — SaaS product -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Nema",
      "applicationCategory": "BusinessApplication",
      "description": "AI-powered real estate virtual tour generator. Turn listing photos into immersive 3D walkthroughs and sell them to agents.",
      "url": "https://nemamarketing.com",
      "offers": [
        { "@type": "Offer", "price": "49", "priceCurrency": "USD", "name": "Pay-as-you-go" },
        { "@type": "Offer", "price": "199", "priceCurrency": "USD", "name": "Pro", "billingIncrement": "Monthly" },
        { "@type": "Offer", "price": "499", "priceCurrency": "USD", "name": "Agency", "billingIncrement": "Monthly" }
      ],
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "5",
        "reviewCount": "50"
      }
    }
    </script>

    <!-- Fonts — preconnect first, then load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

    <!-- Preload critical assets -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
